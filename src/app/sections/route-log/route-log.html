<section id="experiencia" class="mx-auto max-w-6xl px-4 py-20 md:px-6">
  <h2 class="display text-3xl md:text-5xl">{{ deck.copy().logTitle }}</h2>
  <p class="mt-3 max-w-2xl text-sm leading-7 text-fog">{{ deck.copy().logSub }}</p>

  <ol class="rail mt-12">
    @for (jump of jumps; track jump.id) {
      @let j = local(jump);
      <li class="jump">
        <span class="ping" aria-hidden="true"></span>
        <p class="text-[0.68rem] tracking-[0.2em] text-phosphor">
          {{ jump.year }}
          @if (jump.place) {
            <span class="text-fog"> · {{ jump.place }}</span>
          }
        </p>
        <h3 class="display mt-2 text-2xl">{{ j.title }}</h3>
        <p class="mt-2 max-w-xl text-sm leading-7 text-fog">{{ j.signal }}</p>
      </li>
    }
  </ol>
</section>
