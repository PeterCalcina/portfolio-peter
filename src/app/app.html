<a class="skip-link" href="#deck">{{ deck.copy().skip }}</a>

<header class="sticky top-0 z-40 border-b border-line/80 bg-void/80 backdrop-blur-md">
  <div class="mx-auto flex max-w-6xl flex-wrap items-center gap-3 px-4 py-3 md:px-6">
    <p class="kicker shrink-0">{{ deck.copy().brand }}</p>

    <nav class="flex min-w-0 flex-1 gap-1 overflow-x-auto" [attr.aria-label]="deck.copy().brand">
      @for (item of deck.copy().nav; track item.href) {
        <a
          class="shrink-0 px-2.5 py-1 text-[0.72rem] uppercase tracking-[0.16em] text-fog hover:text-ice"
          [href]="item.href"
        >
          {{ item.label }}
        </a>
      }
    </nav>

    <div class="ml-auto flex items-center gap-2">
      <div class="flex rounded-sm border border-line" role="group" aria-label="Language">
        <button
          type="button"
          class="px-2 py-1 text-[0.68rem] tracking-widest"
          [class.bg-phosphor]="deck.lang() === 'es'"
          [class.text-void]="deck.lang() === 'es'"
          [class.text-fog]="deck.lang() !== 'es'"
          (click)="deck.setLang('es')"
        >
          ES
        </button>
        <button
          type="button"
          class="px-2 py-1 text-[0.68rem] tracking-widest"
          [class.bg-phosphor]="deck.lang() === 'en'"
          [class.text-void]="deck.lang() === 'en'"
          [class.text-fog]="deck.lang() !== 'en'"
          (click)="deck.setLang('en')"
        >
          EN
        </button>
      </div>
    </div>
  </div>
</header>

<main>
  <app-hero-deck />
  <app-mission-bento />
  @defer (on viewport) {
    <app-instrument-lab />
  } @placeholder {
    <section class="min-h-[70vh]" aria-hidden="true"></section>
  }
  <app-route-log />
  <app-transmit />
</main>

<footer class="border-t border-line px-4 py-8 text-center text-[0.68rem] tracking-[0.18em] text-fog">
  {{ deck.copy().footer }}
</footer>
