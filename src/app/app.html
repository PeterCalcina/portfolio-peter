<a class="skip-link" href="#deck">{{ deck.copy().skip }}</a>

<header class="sticky top-0 z-40 border-b border-line/80 bg-void/80 backdrop-blur-md">
  <div class="mx-auto flex max-w-6xl items-center gap-3 px-4 py-3 md:px-6">
    <p class="kicker shrink-0">{{ deck.copy().brand }}</p>

    <nav
      class="hidden min-w-0 flex-1 items-center justify-center gap-1 md:flex"
      [attr.aria-label]="deck.copy().brand"
    >
      @for (item of deck.copy().nav; track item.href) {
        <a
          class="px-2.5 py-1 text-[0.72rem] uppercase tracking-[0.16em] text-fog hover:text-ice"
          [href]="item.href"
        >
          {{ item.label }}
        </a>
      }
    </nav>

    <div class="ml-auto flex items-center gap-2">
      <div class="flex overflow-hidden rounded-sm border border-line" role="group" aria-label="Language">
        <button
          type="button"
          class="btn-lang px-2 py-1 text-[0.68rem] tracking-widest"
          [class.is-active]="deck.lang() === 'es'"
          [class.bg-phosphor]="deck.lang() === 'es'"
          [class.text-void]="deck.lang() === 'es'"
          [class.text-fog]="deck.lang() !== 'es'"
          (click)="deck.setLang('es')"
        >
          ES
        </button>
        <button
          type="button"
          class="btn-lang px-2 py-1 text-[0.68rem] tracking-widest"
          [class.is-active]="deck.lang() === 'en'"
          [class.bg-phosphor]="deck.lang() === 'en'"
          [class.text-void]="deck.lang() === 'en'"
          [class.text-fog]="deck.lang() !== 'en'"
          (click)="deck.setLang('en')"
        >
          EN
        </button>
      </div>

      <button
        type="button"
        class="menu-btn inline-flex h-9 w-9 items-center justify-center border border-line text-paper md:hidden"
        [attr.aria-expanded]="menuOpen()"
        aria-controls="mobile-nav"
        [attr.aria-label]="menuOpen() ? 'Cerrar menú' : 'Abrir menú'"
        (click)="toggleMenu()"
      >
        <span class="menu-icon" [class.open]="menuOpen()" aria-hidden="true"></span>
      </button>
    </div>
  </div>

  @if (menuOpen()) {
    <div class="mobile-scrim md:hidden" (click)="closeMenu()"></div>
    <nav
      id="mobile-nav"
      class="mobile-panel border-t border-line px-4 py-4 md:hidden"
      [attr.aria-label]="deck.copy().brand"
    >
      @for (item of deck.copy().nav; track item.href) {
        <a
          class="block border-b border-line/60 px-1 py-3 text-sm uppercase tracking-[0.18em] text-paper last:border-b-0 hover:text-ice"
          [href]="item.href"
          (click)="closeMenu()"
        >
          {{ item.label }}
        </a>
      }
    </nav>
  }
</header>

<main>
  <app-hero-deck />
  <app-mission-bento />
  @defer (on viewport) {
    <app-instrument-lab />
  } @placeholder {
    <section class="min-h-[70vh]" aria-hidden="true"></section>
  }
  <app-route-log />
  <app-transmit />
</main>

<footer class="border-t border-line px-4 py-8 text-center text-[0.68rem] tracking-[0.18em] text-fog">
  {{ deck.copy().footer }}
</footer>
